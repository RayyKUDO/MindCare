<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Prediksi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h1 class="card-title mb-0">Hasil Prediksi Risiko Alzheimer</h1>
                    </div>
                    <div class="card-body text-center">
                        {% if photo %}
                        <img src="{{ photo }}" alt="Foto Pasien" class="img-fluid rounded mb-3" style="max-width: 200px;">
                        {% endif %}
                        <h3 class="mb-3">{{ result }}</h3>
                        <p class="mb-4">Probabilitas: <strong>{{ probability }}</strong></p>
                        <div id="chart" class="mb-4"></div>
                        <a href="/" class="btn btn-primary">Kembali ke Form</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        var probValue = parseFloat("{{ probability.replace('%', '') }}");
        var data = [{
            type: 'pie',
            labels: ['Risiko Rendah', 'Risiko Tinggi'],
            values: [100 - probValue, probValue],
            marker: {
                colors: ['#28a745', '#dc3545']
            }
        }];
        var layout = {
            title: 'Probabilitas Risiko Alzheimer',
            height: 400,
            width: 400
        };
        Plotly.newPlot('chart', data, layout);
    </script>
</body>
</html>
